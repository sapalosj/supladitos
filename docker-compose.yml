# Web app dev server. The Supabase stack (also Docker) is managed by the
# Supabase CLI: `npm run up` starts both.
name: supladitos
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5180:5180"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  web_node_modules:
